<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Prospect Ink - Lead Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--black:#0a0a0a;--dark:#141414;--mid:#1e1e1e;--border:#2a2a2a;--muted:#666;--dim:#333;--white:#f5f5f0;--cream:#f0ede6;--ink:#111;--green:#1a7a4a}
html,body{min-height:100%;background:var(--black)}
body{font-family:'DM Sans',sans-serif;color:var(--white)}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px 32px}
.logo-wrap{text-align:center;margin-bottom:32px}
.logo-img{height:32px;filter:invert(1) brightness(0.85);display:block;margin:0 auto 12px}
.logo-div{width:36px;height:1px;background:var(--dim);margin:10px auto}
.logo-sub{font-size:9px;letter-spacing:4px;color:var(--muted);text-transform:uppercase}
.card{background:var(--dark);border:0.5px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:360px}
.clabel{font-size:9px;letter-spacing:3px;color:var(--muted);text-align:center;margin-bottom:16px;text-transform:uppercase}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.a-btn{padding:15px 8px;border:0.5px solid var(--border);background:var(--mid);border-radius:10px;color:#aaa;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;text-align:center}
.a-btn.sel{border-color:rgba(255,255,255,0.4);color:var(--white);background:#252525}
.pinsec{display:none}
.pinname{font-size:11px;color:var(--muted);text-align:center;margin-bottom:14px}
.pinname b{color:var(--white)}
.dots{display:flex;gap:14px;justify-content:center;margin-bottom:18px}
.dot{width:12px;height:12px;border-radius:50%;border:0.5px solid #333;display:inline-block}
.dot.on{background:var(--white)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk{padding:17px 8px;background:var(--mid);border:0.5px solid var(--border);border-radius:10px;color:#ccc;font-family:'Cormorant Garamond',serif;font-size:20px;cursor:pointer;text-align:center}
.pk:active{transform:scale(0.94)}
.util{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--muted)}
.perr{font-size:11px;color:#c0392b;text-align:center;margin-top:10px;min-height:16px}
#dash{display:none;min-height:100vh;background:var(--cream);flex-direction:column}
.top{background:var(--black);padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.tlogo{height:22px;filter:invert(1) brightness(0.85)}
.twho{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.tout{font-size:9px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:'DM Sans',sans-serif;padding:6px}
.dbody{padding:14px;flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:#fff;border:0.5px solid #e0ddd6;border-radius:10px;padding:12px 10px;text-align:center}
.sl{font-size:8px;letter-spacing:1px;color:#999;text-transform:uppercase;margin-bottom:2px}
.sv{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;color:var(--ink)}
.sv.g{color:var(--green)}
.fbar{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding:4px 0}
.fbar::-webkit-scrollbar{display:none}
.fb{padding:5px 14px;border-radius:20px;border:0.5px solid #d8d4cc;background:#fff;font-size:10px;cursor:pointer;color:#888;font-family:'DM Sans',sans-serif;white-space:nowrap;flex-shrink:0}
.fb.on{background:var(--black);color:#fff}
.srch{margin-bottom:12px}
.srch input{width:100%;padding:9px 16px;border-radius:24px;border:0.5px solid #d8d4cc;background:#fff;font-size:13px;color:var(--ink);font-family:'DM Sans',sans-serif;outline:none}
.leads{display:flex;flex-direction:column;gap:8px}
.lr{background:#fff;border:0.5px solid #e8e4dc;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.lr1{display:flex;align-items:center;gap:8px}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lname{font-size:15px;font-weight:500;color:var(--ink);flex:1}
.ltag{font-size:9px;padding:3px 8px;border-radius:6px;font-weight:500;text-transform:uppercase}
.ldate{font-size:10px;color:#ccc}
.linfo{font-size:12px;color:#888}
.lacts{display:flex;gap:8px}
.ab{display:flex;align-items:center;justify-content:center;padding:10px;border-radius:10px;font-size:12px;font-family:'DM Sans',sans-serif;text-decoration:none;border:0.5px solid;font-weight:500;flex:1}
.em{color:#1a4f8a;border-color:#c5d8f0;background:#eef4fb}
.sm{color:#1a6b42;border-color:#b8deca;background:#edf7f2}
.ca{color:#b86e00;border-color:#f0ddb8;background:#fdf5e6}
.lst{width:100%;font-size:13px;padding:10px;border-radius:10px;border:0.5px solid #ddd;background:#f8f5f0;cursor:pointer;font-family:'DM Sans',sans-serif;outline:none}
.empty{text-align:center;padding:3rem;color:#bbb;font-size:14px}
.footer{text-align:center;padding:18px;font-size:9px;letter-spacing:2px;color:#bbb;text-transform:uppercase;border-top:0.5px solid #e0ddd6;background:#ebe8e0}
.footer img{height:14px;filter:opacity(0.2);display:block;margin:0 auto 8px}
</style>
</head>

<script>
var PINS={Admin:"0000",Douglas:"1234",Pedro:"2345",Joice:"3456",Bo:"4567",Samara:"5678",Kamryn:"6789",Ivan:"7890",Muchy:"8901"};
var COL={Douglas:{d:"#1F4E79",b:"#D6E4F0",t:"#1F4E79"},Pedro:{d:"#375623",b:"#E2EFDA",t:"#375623"},Joice:{d:"#7B2D8B",b:"#F3E5F5",t:"#7B2D8B"},Bo:{d:"#B45309",b:"#FDEBD0",t:"#B45309"},Samara:{d:"#6D4C41",b:"#EFEBE9",t:"#6D4C41"},Kamryn:{d:"#8B4513",b:"#F5E6D3",t:"#8B4513"},Ivan:{d:"#1a1a2e",b:"#e8e8f0",t:"#1a1a2e"},Muchy:{d:"#C2185B",b:"#fce4ec",t:"#C2185B"}};
var SC={New:"#1a4f8a",Contacted:"#b86e00",Responded:"#333",Consultation:"#7B2D8B",Closed:"#1a6b42","No Response":"#aaa"};
var SS=["New","Contacted","Responded","Consultation","Closed","No Response"];
var ALL=JSON.parse(document.getElementById("data").textContent);
var usr=null,sel=null,pin="",fa="all",sq="";
var sts=JSON.parse(localStorage.getItem("pi9")||"{}");
function save(){localStorage.setItem("pi9",JSON.stringify(sts))}

// Artist buttons
var names=Object.keys(PINS);
names.forEach(function(n){
  var b=document.getElementById("bn_"+n);
  if(b) b.addEventListener("click",function(){pick(n,b)});
});

// PIN buttons
for(var i=0;i<=9;i++){
  (function(v){
    var b=document.getElementById("pk"+v);
    if(b) b.addEventListener("click",function(){kp(String(v))});
  })(i);
}
document.getElementById("pkc").addEventListener("click",function(){kp("clr")});
document.getElementById("pkd").addEventListener("click",function(){kp("del")});
document.getElementById("outbtn").addEventListener("click",out);
document.getElementById("sinp").addEventListener("input",function(){sq=this.value.toLowerCase();rl()});

function pick(n,b){sel=n;pin="";document.querySelectorAll(".a-btn").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");document.getElementById("pnm").textContent=n;document.getElementById("psec").style.display="block";document.getElementById("perr").textContent="";dots()}
function dots(){for(var i=0;i<4;i++){document.getElementById("d"+i).className="dot"+(i<pin.length?" on":"")}}
function kp(v){if(!sel)return;if(v==="clr")pin="";else if(v==="del")pin=pin.slice(0,-1);else if(pin.length<4)pin+=v;dots();document.getElementById("perr").textContent="";if(pin.length===4)chk()}
function chk(){if(pin===PINS[sel]){usr=sel;document.getElementById("login").style.display="none";document.getElementById("dash").style.display="flex";render()}else{document.getElementById("perr").textContent="Incorrect PIN";pin="";dots()}}
function out(){usr=null;sel=null;pin="";fa="all";sq="";document.getElementById("dash").style.display="none";document.getElementById("login").style.display="flex";document.querySelectorAll(".a-btn").forEach(function(x){x.classList.remove("sel")});document.getElementById("psec").style.display="none";dots()}
function ml(){return usr==="Admin"?ALL:ALL.filter(function(l){return l.artist===usr})}
function render(){
  document.getElementById("who").textContent=usr==="Admin"?"Admin":usr;
  var m=ml(),cl=m.filter(function(l){return(sts[l.id]||"New")==="Closed"}).length;
  var rt=m.length?Math.round(cl/m.length*100):0;
  document.getElementById("stats").innerHTML='<div class="stat"><div class="sl">Total</div><div class="sv">'+m.length+'</div></div><div class="stat"><div class="sl">Closed</div><div class="sv g">'+cl+'</div></div><div class="stat"><div class="sl">Conv%</div><div class="sv">'+rt+'%</div></div>';
  if(usr==="Admin"){
    var fb='<button class="fb on" data-f="all">All</button>';
    ["Douglas","Pedro","Joice","Bo","Samara","Kamryn","Ivan","Muchy"].forEach(function(a){fb+='<button class="fb" data-f="'+a+'">'+a+"</button>"});
    document.getElementById("fbar").innerHTML=fb;
    document.querySelectorAll(".fb").forEach(function(b){b.addEventListener("click",function(){fa=this.getAttribute("data-f");document.querySelectorAll(".fb").forEach(function(x){x.classList.remove("on")});this.classList.add("on");rl()})});
  } else {
    document.getElementById("fbar").innerHTML="";
  }
  rl()
}
function rl(){
  var isA=usr==="Admin";
  var m=ml().filter(function(l){var ma=!isA||fa==="all"||l.artist===fa;var ms=!sq||l.name.toLowerCase().indexOf(sq)>-1||l.email.toLowerCase().indexOf(sq)>-1||(l.city||"").toLowerCase().indexOf(sq)>-1;return ma&&ms});
  if(!m.length){document.getElementById("leads").innerHTML='<div class="empty">No leads found</div>';return}
  var h="";
  m.forEach(function(l){
    var c=COL[l.artist]||{d:"#888",b:"#eee",t:"#333"},st=sts[l.id]||"New";
    var ph=(l.phone||"").replace("p:","").trim(),cl=ph.replace(/[^\d+]/g,""),num=cl[0]==="+"?cl:"+1"+cl;
    var opts=SS.map(function(s){return"<option"+(s===st?" selected":"")+">"+s+"</option>"}).join("");
    var tag=isA?"<span class='ltag' style='background:"+c.b+";color:"+c.t+"'>"+l.artist+"</span>":"";
    h+="<div class='lr'><div class='lr1'><div class='ldot' style='background:"+c.d+"'></div><div class='lname'>"+l.name+"</div>"+tag+"<div class='ldate'>"+l.date+"</div></div><div class='linfo'>"+l.email+" - "+(l.city||"")+"</div><div class='lacts'><a class='ab em' href='mailto:"+l.email+"'>Email</a><a class='ab sm' href='sms:"+num+"'>Text</a><a class='ab ca' href='tel:"+num+"'>Call</a></div><select class='lst' data-id='"+l.id+"' style='color:"+(SC[st]||"#111")+"'>"+opts+"</select></div>"
  });
  document.getElementById("leads").innerHTML=h;
  document.querySelectorAll(".lst").forEach(function(s){s.addEventListener("change",function(){var id=this.getAttribute("data-id"),st=this.value;sts[id]=st;save();this.style.color=SC[st]||"#111";render()})});
}
</script>
